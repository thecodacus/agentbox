services:
  manager:
    build: ./manager
    ports:
      - "4000:4000"   # REST API
      - "4001:4001"   # MCP SSE
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MANAGER_URL=http://localhost:4000
      # Interface that sandbox/deployment ports are published on.
      # Loopback by default — set to 0.0.0.0 only if you want LAN access.
      - BIND_HOST=${BIND_HOST:-127.0.0.1}
    restart: unless-stopped

networks:
  default:
    name: agentbox-net
    driver: bridge
