services:
  manager:
    build: ./manager
    ports:
      # Loopback only: the manager controls Docker, so it must not be
      # reachable from the network. Override BIND only if you know why.
      - "${MANAGER_BIND:-127.0.0.1}:4000:4000"   # REST API
      - "${MANAGER_BIND:-127.0.0.1}:4001:4001"   # MCP SSE
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MANAGER_URL=http://localhost:4000
      # Shared secret required on every manager API call.
      # Generate with: openssl rand -hex 32
      - MANAGER_TOKEN=${MANAGER_TOKEN:-}
      # Resource caps for spawned containers — see README
      - SANDBOX_MEMORY_MB=${SANDBOX_MEMORY_MB:-1024}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-1}
      - BROWSER_MEMORY_MB=${BROWSER_MEMORY_MB:-3072}
      - DEPLOYMENT_MEMORY_MB=${DEPLOYMENT_MEMORY_MB:-512}
      # Interface that sandbox/deployment ports are published on.
      # Loopback by default — set to 0.0.0.0 only if you want LAN access.
      - BIND_HOST=${BIND_HOST:-127.0.0.1}
    restart: unless-stopped

networks:
  default:
    name: agentbox-net
    driver: bridge
